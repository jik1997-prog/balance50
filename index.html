document.addEventListener("click",e=>{const n=e.target.closest("[data-nadd]");if(n){const x=STK[+n.dataset.nadd];if(!WL.includes(x.s)){WL.push(x.s);saveWL();list()}runNav();return}
const g=e.target.closest("[data-go]");if(g){cur=STK[+g.dataset.go];go("dash");list();render();return}
const c=e.target.closest("[data-f]");if(c){const st=c.dataset.f==="ly"?fLy:c.dataset.f==="cat"?fCat:fTech,v=c.dataset.f==="tech"?+c.dataset.v:c.dataset.v;st.has(v)?st.delete(v):st.add(v);c.classList.toggle("on");runNav();return}
const p=e.target.closest("[data-p]");if(p){const[k,a,b]=p.dataset.p.split("|");$("n_"+k+"_a").value=a;$("n_"+k+"_b").value=b;runNav();return}
if(e.target.id==="nrs"){fLy.clear();fCat.clear();fTech.clear();document.querySelectorAll("#nf input").forEach(i=>i.value="");document.querySelectorAll("#nf .chip.on").forEach(i=>i.classList.remove("on"));runNav()}});
buildNav();$("nf").addEventListener("input",runNav);$("ns").onchange=runNav;runNav();list();render();techs();

</script></body></html>
